name: Production contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media probes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Immutable brief, graph, hashes, review evidence
        run: python3 tools/validate.py
      - name: Unit, mutation and synthetic assembly tests
        run: python3 -m unittest discover -s tests -v
      - name: Generated queue is current
        run: python3 tools/render_queue.py && git diff --exit-code -- tasks/QUEUE.md
